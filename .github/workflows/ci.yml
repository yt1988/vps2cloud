# Every push and pull request: formatting, vet, a build, and a short real run against a few providers.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o vps2cloud .
      - name: Short run
        run: |
          ./vps2cloud --offline -p aws,hetzner,vultr -n 3 -m tcp,https --top 10
          ./vps2cloud --offline -p aws -r 'eu-*' -n 2 -o json --file out.json
          jq -e '.regions | length > 0' out.json
